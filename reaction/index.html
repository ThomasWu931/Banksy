<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reaction Tester</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@300;500;700&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* One dark instrument panel; the whole screen is the button. Big mono readout, one coral signal lamp. */
  :root{
    --field:#101218;      /* stage background */
    --panel:#171a22;      /* strip + cards */
    --line:#262a35;
    --ink:#e9e6df;        /* warm off-white text */
    --dim:#8b8f9c;
    --signal:#ff5a4e;     /* the dot */
    --good:#7fd1b9; --warn:#f2b45a;
    --mono:"Martian Mono",ui-monospace,"SF Mono",Menlo,monospace;
    --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--field);color:var(--ink);font-family:var(--sans);display:flex;flex-direction:column;overflow:hidden;
    -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  button{font:inherit;color:inherit;cursor:pointer}
  button:focus-visible,#stage:focus-visible{outline:2px solid var(--signal);outline-offset:-4px}

  header{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:14px 16px 0;flex-wrap:wrap}
  .name{font-family:var(--mono);font-weight:500;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
  .name b{color:var(--ink);font-weight:700}
  .pb{display:flex;gap:6px 18px;flex-wrap:wrap;font-family:var(--mono);font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);font-variant-numeric:tabular-nums}
  .pb span{display:grid;gap:2px;white-space:nowrap}
  .pb span b{color:var(--ink);font-weight:500;font-size:.8rem;letter-spacing:0;text-transform:none}

  #stage{flex:1;position:relative;display:grid;place-items:center;cursor:pointer;touch-action:manipulation;outline:none;transition:background .12s}
  #stage.early{background:#1d1214}
  .center{display:grid;place-items:center;gap:18px;text-align:center;padding:0 16px}
  .lamp{width:84px;height:84px;display:grid;place-items:center;position:relative;transform:translateX(clamp(36px,9vw,80px))}
  .dot{width:26px;height:26px;border-radius:50%;visibility:hidden}
  .dot img{display:block;width:26px;height:26px}
  .go .dot{visibility:visible;box-shadow:0 0 0 6px rgba(255,90,78,.18),0 0 28px rgba(255,90,78,.65)}
  .ring{position:absolute;width:26px;height:26px;border-radius:50%;border:2px solid var(--signal);opacity:0}
  .go .ring{animation:ping .9s ease-out infinite}
  @keyframes ping{from{opacity:.7;transform:scale(1)}to{opacity:0;transform:scale(3.2)}}

  .readout{font-family:var(--mono);font-weight:300;font-size:clamp(3.2rem,15vw,6.5rem);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em;min-height:1em}
  .readout small{font-size:.32em;font-weight:500;color:var(--dim);margin-left:.2em;letter-spacing:.06em}
  .msg{font-size:1.05rem;color:var(--dim);max-width:30ch;text-wrap:balance;min-height:1.4em}
  .msg strong{color:var(--ink);font-weight:600}
  .verdict{font-family:var(--mono);font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;padding:5px 10px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
  .verdict.v-elite{color:var(--good);border-color:rgba(127,209,185,.4)}
  .verdict.v-good{color:var(--ink)}
  .verdict.v-slow{color:var(--warn);border-color:rgba(242,180,90,.4)}
  .verdict.v-early{color:var(--signal);border-color:rgba(255,90,78,.45)}
  .prec{font-family:var(--mono);font-size:.66rem;color:var(--dim);letter-spacing:.04em;font-variant-numeric:tabular-nums;min-height:1.2em;text-align:center}
  .pips{display:flex;gap:8px}
  .pip{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--dim)}
  .pip.done{background:var(--ink);border-color:var(--ink)}

  /* Strip chart: last attempts on a fixed 100–600 ms scale with the human-average band */
  .strip{background:var(--panel);border-top:1px solid var(--line);padding:12px 16px calc(14px + env(safe-area-inset-bottom));display:grid;gap:8px}
  .strip-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-family:var(--mono);font-size:.68rem;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
  .strip-head button{background:none;border:none;color:var(--dim);font:inherit;text-decoration:underline;text-underline-offset:3px;padding:0;text-transform:uppercase;letter-spacing:.08em}
  .modes{display:flex;gap:6px;padding:12px 16px 0;flex-wrap:wrap}
  .modes button{flex:1;min-width:72px;display:grid;gap:2px;background:transparent;border:1px solid var(--line);border-radius:10px;padding:7px 8px;font-family:var(--mono);font-size:.72rem;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
  .modes button small{font-size:.6rem;letter-spacing:.02em;text-transform:none;font-weight:300}
  .modes button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:var(--panel)}
  .modes button:disabled{opacity:.4;cursor:not-allowed}
  /* Histogram: 25 ms bins from 100–600 ms plus an overflow bin, human-typical band shaded */
  .hist{position:relative;height:84px;display:flex;align-items:flex-end;gap:2px;border-bottom:1px solid var(--line)}
  .hist .band{position:absolute;top:0;bottom:0;background:rgba(233,230,223,.05);border-left:1px dashed var(--line);border-right:1px dashed var(--line);pointer-events:none}
  .hist .band span{position:absolute;top:2px;left:6px;font-family:var(--mono);font-size:.6rem;color:var(--dim);white-space:nowrap}
  .hist .ymax{position:absolute;top:0;right:0;font-family:var(--mono);font-size:.6rem;color:var(--dim)}
  .bar{flex:1;min-height:0;background:var(--ink);opacity:.75;border-radius:2px 2px 0 0;position:relative;z-index:1}
  .bar.zero{background:transparent}
  .bar.over{background:var(--warn)}
  .bar.last{background:var(--signal);opacity:1}
  .axis{position:relative;height:14px}
  .tick{position:absolute;top:2px;transform:translateX(-50%);font-family:var(--mono);font-size:.6rem;color:var(--dim);font-variant-numeric:tabular-nums}
  @media (prefers-reduced-motion:reduce){.go .ring{animation:none}#stage{transition:none}}
</style>
</head>
<body>
<header>
  <div class="name"><b>Reaction</b> tester</div>
  <div class="pb" aria-live="polite">
    <span>Best<b id="best">—</b></span>
    <span>Median<b id="med">—</b></span>
    <span>Avg last 5<b id="avg5">—</b></span>
    <span>Too soon<b id="early">0</b></span>
    <span>Display<b id="hz">—</b></span>
  </div>
</header>
<nav class="modes" id="modes" aria-label="Wait before the dot appears">
  <button type="button" data-mode="short">Short<small>0.8–1.6 s</small></button>
  <button type="button" data-mode="medium">Medium<small>1.5–3 s</small></button>
  <button type="button" data-mode="long">Long<small>3–6 s</small></button>
  <button type="button" data-mode="random">Random<small>0.5–8 s</small></button>
</nav>

<main id="stage" tabindex="0" aria-label="Reaction area. Tap, click or press Space.">
  <div class="center">
    <div class="lamp" id="lamp">
      <div class="ring"></div>
      <div class="dot" id="dot"></div>
    </div>
    <div class="readout" id="readout">243<small>ms</small></div>
    <div class="verdict" id="verdict">Example</div>
    <div class="prec" id="prec"></div>
    <div class="msg" id="msg"><strong>Tap anywhere to start.</strong> Wait for the red dot, then tap as fast as you can.</div>
    <div class="pips" id="pips" aria-label="Round progress"></div>
  </div>
</main>

<section class="strip" aria-label="Recent attempts">
  <div class="strip-head"><span id="stripLabel">Histogram · ms</span><button id="clear" type="button">Clear history</button></div>
  <div class="hist" id="hist"></div>
  <div class="axis" id="axis"></div>
</section>

<script>
(() => {
  const ROUND = 5, LO = 100, HI = 600, BIN = 25;
  const MODES = { short: [800, 1600], medium: [1500, 3000], long: [3000, 6000], random: [500, 8000] };
  const MODE_NAME = { short: 'Short', medium: 'Medium', long: 'Long', random: 'Random' };
  const ANTICIPATION_MS = 100;   // faster than this is a guess, not a reaction (standard cut-off)
  const KEY = 'reaction-tester-v1';
  const $ = s => document.querySelector(s);
  const stage = $('#stage'), lamp = $('#lamp'), dotBox = $('#dot');

  // ---- persisted per-viewer history (best effort) ----
  let saved = { history: [], early: 0, mode: 'medium' };
  try { const r = localStorage.getItem(KEY); if (r) saved = Object.assign(saved, JSON.parse(r)); } catch (e) {}
  // Older saves stored bare numbers (all from a 1.2–4.2 s wait, closest to Medium).
  saved.history = saved.history.map(h => typeof h === 'number' ? { ms: h, mode: 'medium' } : h);
  if (!MODES[saved.mode]) saved.mode = 'medium';
  const modeHist = () => saved.history.filter(h => h.mode === saved.mode).map(h => h.ms);
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch (e) {} };

  let phase = 'idle';        // idle | waiting | go | result | early | summary
  let timer = null, round = [];

  // ---------- Timing ----------
  // Stimulus onset, best source first:
  //  1. Element Timing: the browser reports when the dot image was actually painted (Chrome, Edge).
  //  2. Otherwise the vsync after the frame that drew the dot (double requestAnimationFrame).
  // Response: the pointer/key event's own timestamp from the OS input event, not when our code ran.
  // All on the same high-resolution clock as performance.now().
  let trial = 0, frameOnset = null, paintOnset = null, onsetFrameStart = null;
  const etSupported = typeof PerformanceObserver !== 'undefined' && 'PerformanceElementTiming' in window;
  if (etSupported) {
    try {
      new PerformanceObserver(list => {
        for (const e of list.getEntries()) {
          if (e.identifier === 'dot-' + trial && e.renderTime > 0) paintOnset = e.renderTime;
        }
      }).observe({ type: 'element', buffered: false });
    } catch (e) {}
  }

  // Display refresh: measured continuously from frame intervals; keeping a frame loop running
  // while waiting also stops the browser idling the render pipeline, which adds latency to the first frame.
  const intervals = [];
  let lastFrame = 0, frameLoop = 0;
  function sampleFrames(t) {
    if (lastFrame) { const d = t - lastFrame; if (d > 2 && d < 60) { intervals.push(d); if (intervals.length > 120) intervals.shift(); } }
    lastFrame = t;
    frameLoop = requestAnimationFrame(sampleFrames);
  }
  const frameMs = () => {
    if (intervals.length < 10) return 1000 / 60;
    const s = intervals.slice().sort((a, b) => a - b); return s[Math.floor(s.length / 2)];
  };
  function startFrames() { if (!frameLoop) { lastFrame = 0; frameLoop = requestAnimationFrame(sampleFrames); } }

  // Pre-decoded dot image, so showing it is a paint, not a decode.
  const DOT_SRC = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 26 26"><circle cx="13" cy="13" r="13" fill="#ff5a4e"/></svg>');
  let nextDot = null;
  function prepareDot() {
    const img = new Image(26, 26);
    img.alt = ''; img.decoding = 'sync'; img.src = DOT_SRC;
    nextDot = img;
    if (img.decode) img.decode().catch(() => {});
  }

  function onsetTime() {
    // Prefer the browser's paint time when it is plausible for this frame.
    if (paintOnset != null && onsetFrameStart != null && paintOnset >= onsetFrameStart && paintOnset - onsetFrameStart < 100) return [paintOnset, 'paint'];
    return frameOnset == null ? [null, ''] : [frameOnset, 'frame'];
  }

  // ---------- Rounds ----------
  function verdictFor(ms) {
    if (ms < 180) return ['Elite', 'v-elite'];
    if (ms < 230) return ['Sharp', 'v-good'];
    if (ms < 300) return ['Average', 'v-good'];
    return ['Slow', 'v-slow'];
  }
  const avg = a => Math.round(a.reduce((x, y) => x + y, 0) / a.length);

  function setReadout(ms) { $('#readout').innerHTML = ms == null ? '&nbsp;' : `${ms}<small>ms</small>`; }
  function setVerdict(text, cls) { const v = $('#verdict'); v.textContent = text || ''; v.className = 'verdict ' + (cls || ''); v.style.visibility = text ? 'visible' : 'hidden'; }
  function setMsg(html) { $('#msg').innerHTML = html; }
  function setPrec(text) { $('#prec').textContent = text || ''; }

  function renderPips() {
    $('#pips').innerHTML = Array.from({ length: ROUND }, (_, i) => `<span class="pip ${i < round.length ? 'done' : ''}"></span>`).join('');
  }
  const median = a => { const s = a.slice().sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : Math.round((s[m - 1] + s[m]) / 2); };
  function renderStats() {
    const h = modeHist();
    $('#best').textContent = h.length ? Math.min(...h) + ' ms' : '—';
    $('#med').textContent = h.length ? median(h) + ' ms' : '—';
    const last5 = h.slice(-5);
    $('#avg5').textContent = last5.length === 5 ? avg(last5) + ' ms' : '—';
    $('#early').textContent = saved.early;
    $('#hz').textContent = Math.round(1000 / frameMs()) + ' Hz';
  }
  function renderHist() {
    const h = modeHist(), nb = (HI - LO) / BIN, counts = new Array(nb + 1).fill(0);
    const binOf = v => v >= HI ? nb : Math.max(0, Math.floor((v - LO) / BIN));
    h.forEach(v => counts[binOf(v)]++);
    const max = Math.max(1, ...counts), lastBin = h.length ? binOf(h[h.length - 1]) : -1;
    const x = v => ((v - LO) / (HI - LO)) * (nb / (nb + 1)) * 100; // overflow bin takes the last slot
    let out = `<div class="band" style="left:${x(200)}%;width:${x(270) - x(200)}%"><span>typical 200–270</span></div><span class="ymax">${h.length ? max : ''}</span>`;
    counts.forEach((c, i) => {
      const range = i === nb ? `${HI}+ ms` : `${LO + i * BIN}–${LO + (i + 1) * BIN - 1} ms`;
      out += `<div class="bar ${c ? '' : 'zero'} ${i === lastBin ? 'last' : ''} ${i === nb && c ? 'over' : ''}" style="height:${(c / max) * 100}%" title="${range}: ${c}"></div>`;
    });
    $('#hist').innerHTML = out;
    let ax = '';
    for (let t = LO; t <= HI; t += 100) ax += `<span class="tick" style="left:${x(t)}%">${t}</span>`;
    $('#axis').innerHTML = ax;
    $('#stripLabel').textContent = h.length ? `${MODE_NAME[saved.mode]} · ${h.length} attempt${h.length === 1 ? '' : 's'} · 25 ms bins` : `${MODE_NAME[saved.mode]} · no attempts yet`;
  }

  function renderModes() {
    document.querySelectorAll('#modes button').forEach(b => {
      b.setAttribute('aria-pressed', b.dataset.mode === saved.mode ? 'true' : 'false');
      b.disabled = phase === 'waiting' || phase === 'go';
    });
  }

  function setPhase(p) {
    phase = p;
    stage.className = p === 'early' ? 'early' : '';
    lamp.className = 'lamp ' + (p === 'go' ? 'go' : '');
    if (p !== 'go') dotBox.replaceChildren();
    renderModes();
  }

  function arm() {
    clearTimeout(timer);
    if (round.length >= ROUND) round = [];
    trial += 1; frameOnset = null; paintOnset = null; onsetFrameStart = null;
    prepareDot(); startFrames();
    setPhase('waiting');
    setReadout(null); setVerdict(''); setPrec('');
    setMsg('Wait for the red dot…');
    renderPips();
    const id = trial;
    timer = setTimeout(() => {
      // Change the DOM at the start of a frame so the dot lands in exactly that frame.
      requestAnimationFrame(t1 => {
        if (phase !== 'waiting' || id !== trial) return;
        nextDot.setAttribute('elementtiming', 'dot-' + id);
        dotBox.replaceChildren(nextDot);
        setPhase('go');
        onsetFrameStart = t1;
        // The next vsync is when the frame drawn at t1 reaches the screen.
        requestAnimationFrame(t2 => { if (id === trial) frameOnset = t2; });
      });
    }, (([a, b]) => a + Math.random() * (b - a))(MODES[saved.mode]));
  }

  function hit(stamp) {
    const [onset, src] = onsetTime();
    const raw = onset == null ? 0 : stamp - onset;
    if (onset == null || raw < ANTICIPATION_MS) return tooSoon(true);
    const ms = Math.round(raw);
    round.push(ms);
    const prior = modeHist();
    const newBest = !prior.length || ms < Math.min(...prior);
    saved.history.push({ ms, mode: saved.mode }); if (saved.history.length > 2000) saved.history.shift();
    persist();
    setReadout(ms);
    const [vt, vc] = verdictFor(ms); setVerdict(newBest ? 'New best' : vt, newBest ? 'v-elite' : vc);
    const hz = Math.round(1000 / frameMs()), err = src === 'paint' ? 1 : Math.max(1, Math.round(frameMs() / 2));
    setPrec(`${raw.toFixed(1)} ms raw · ±${err} ms · ${hz} Hz · ${src === 'paint' ? 'paint-timed' : 'frame-timed'}`);
    renderPips(); renderStats(); renderHist();
    if (round.length >= ROUND) {
      setPhase('summary');
      const a = avg(round), b = Math.min(...round);
      setMsg(`Round done. Average <strong>${a} ms</strong>, best <strong>${b} ms</strong>. Tap to start a new round.`);
    } else {
      setPhase('result');
      setMsg(`Attempt ${round.length} of ${ROUND}. Tap to go again.`);
    }
  }

  function tooSoon(anticipated) {
    clearTimeout(timer);
    saved.early += 1; persist();
    setPhase('early');
    setReadout(null); setVerdict('Too soon', 'v-early'); setPrec('');
    setMsg(anticipated
      ? `Under ${ANTICIPATION_MS} ms is faster than a human can react, so that was a guess. It doesn't count. Tap to try again.`
      : 'You tapped before the dot appeared. That one doesn\'t count. Tap to try again.');
    renderStats();
  }

  function press(stamp) {
    if (phase === 'waiting') return tooSoon(false);
    if (phase === 'go') return hit(stamp);
    arm(); // idle, result, early, summary
  }

  // pointerdown fires on first contact (earlier than click/touchend); event.timeStamp is the input event's own time.
  const stampOf = e => (e.timeStamp > 0 && e.timeStamp < performance.now() + 1000 ? e.timeStamp : performance.now());
  stage.addEventListener('pointerdown', e => { if (e.button > 0) return; e.preventDefault(); press(stampOf(e)); });
  window.addEventListener('keydown', e => {
    if ((e.code === 'Space' || e.code === 'Enter') && !e.repeat && !(e.target instanceof HTMLButtonElement)) { e.preventDefault(); press(stampOf(e)); }
  });
  stage.addEventListener('contextmenu', e => e.preventDefault());

  $('#modes').addEventListener('click', e => {
    const b = e.target.closest('button[data-mode]'); if (!b || b.disabled) return;
    if (b.dataset.mode === saved.mode) return;
    saved.mode = b.dataset.mode; round = []; persist();
    setPhase('idle'); setReadout(null); setVerdict(''); setPrec('');
    setMsg(`<strong>${MODE_NAME[saved.mode]} mode.</strong> Tap anywhere to start.`);
    renderPips(); renderStats(); renderHist();
  });
  $('#clear').addEventListener('click', () => {
    saved = { history: [], early: 0, mode: saved.mode }; round = []; persist();
    renderStats(); renderHist(); renderPips();
  });

  // Opening state
  startFrames();
  setTimeout(renderStats, 1500); // refresh-rate reading once measured
  renderPips(); renderStats(); renderHist();
  renderModes();
  const prev = modeHist();
  if (prev.length) { setReadout(prev[prev.length - 1]); setVerdict('Last time', ''); }
})();
</script>
</body>
</html>
